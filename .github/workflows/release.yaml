name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing Git tag to release
        required: true
        type: string

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG }}

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Validate release tag
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid semantic version tag: ${RELEASE_TAG}" >&2
            exit 1
          fi
          git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}" >/dev/null

      - name: Test
        run: go test -race ./...

      - name: Vet
        run: go vet ./...

      - name: Build release binaries
        shell: bash
        run: |
          set -euo pipefail
          commit="$(git rev-parse HEAD)"
          build_date="$(git show -s --format=%cI HEAD)"
          ldflags="-s -w -X main.version=${RELEASE_TAG} -X main.commit=${commit} -X main.date=${build_date}"

          mkdir -p dist
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH="${arch}" \
              go build -buildvcs=false -trimpath -ldflags "${ldflags}" \
              -o "dist/ycr-credential-provider-linux-${arch}" \
              ./cmd/ycr-credential-provider
            CGO_ENABLED=0 GOOS=linux GOARCH="${arch}" \
              go build -buildvcs=false -trimpath -ldflags "${ldflags}" \
              -o "dist/lockbox-eso-provider-linux-${arch}" \
              ./cmd/lockbox-eso-provider
          done

          (
            cd dist
            sha256sum \
              ycr-credential-provider-linux-amd64 \
              ycr-credential-provider-linux-arm64 \
              lockbox-eso-provider-linux-amd64 \
              lockbox-eso-provider-linux-arm64 \
              > SHA256SUMS
          )

      - name: Publish Lockbox provider container
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          echo "${GH_TOKEN}" | docker login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin

          owner="${GITHUB_REPOSITORY_OWNER,,}"
          version="${RELEASE_TAG#v}"
          commit="$(git rev-parse HEAD)"
          build_date="$(git show -s --format=%cI HEAD)"
          tags=(--tag "ghcr.io/${owner}/lockbox-eso-provider:${version}")
          if [[ "${RELEASE_TAG}" != *-* ]]; then
            tags+=(--tag "ghcr.io/${owner}/lockbox-eso-provider:latest")
          fi

          docker buildx create --driver docker-container --use
          docker buildx build \
            --file Dockerfile.lockbox \
            --platform linux/amd64,linux/arm64 \
            --build-arg "VERSION=${RELEASE_TAG}" \
            --build-arg "COMMIT=${commit}" \
            --build-arg "BUILD_DATE=${build_date}" \
            --provenance=true \
            --sbom=true \
            "${tags[@]}" \
            --push \
            .

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          prerelease=()
          if [[ "${RELEASE_TAG}" == *-* ]]; then
            prerelease+=(--prerelease)
          fi

          gh release create "${RELEASE_TAG}" \
            dist/ycr-credential-provider-linux-amd64 \
            dist/ycr-credential-provider-linux-arm64 \
            dist/lockbox-eso-provider-linux-amd64 \
            dist/lockbox-eso-provider-linux-arm64 \
            dist/SHA256SUMS \
            --verify-tag \
            --title "Yandex Cloud providers ${RELEASE_TAG}" \
            --generate-notes \
            "${prerelease[@]}"
