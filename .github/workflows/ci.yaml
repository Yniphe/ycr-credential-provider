name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Format check
        run: test -z "$(gofmt -l .)"
      - name: Test
        run: go test -race ./...
      - name: Vet
        run: go vet ./...
      - name: Build Linux binaries
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o dist/ycr-credential-provider-linux-amd64 ./cmd/ycr-credential-provider
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -o dist/ycr-credential-provider-linux-arm64 ./cmd/ycr-credential-provider
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o dist/lockbox-eso-provider-linux-amd64 ./cmd/lockbox-eso-provider
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -o dist/lockbox-eso-provider-linux-arm64 ./cmd/lockbox-eso-provider
      - name: Build Lockbox provider container
        run: docker build --file Dockerfile.lockbox --tag lockbox-eso-provider:test .
